<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin Login — TechnoBuzz</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="sidebar-logo-mark" aria-hidden="true">TB</div>
      <div>
        <h1>TechnoBuzz</h1>
        <p>Admin Panel</p>
      </div>
    </div>
    <p class="sub">Sign in to manage businesses and reviews.</p>
    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/admin/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" title="Show password" aria-pressed="false">
          <svg id="eyeOpenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    (function () {
      var pwdInput = document.getElementById("password");
      var toggleBtn = document.getElementById("togglePassword");
      var eyeOpen = document.getElementById("eyeOpenIcon");
      var eyeOff = document.getElementById("eyeOffIcon");
      if (!pwdInput || !toggleBtn) return;
      toggleBtn.addEventListener("click", function () {
        var isHidden = pwdInput.type === "password";
        pwdInput.type = isHidden ? "text" : "password";
        eyeOpen.style.display = isHidden ? "none" : "";
        eyeOff.style.display = isHidden ? "" : "none";
        var label = isHidden ? "Hide password" : "Show password";
        toggleBtn.setAttribute("aria-label", label);
        toggleBtn.setAttribute("title", label);
        toggleBtn.setAttribute("aria-pressed", isHidden ? "true" : "false");
      });
    })();
  </script>
</body>
</html>
