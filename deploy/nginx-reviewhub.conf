# Copy to: /etc/nginx/sites-available/reviewhub
# Then: ln -s /etc/nginx/sites-available/reviewhub /etc/nginx/sites-enabled/
# After DNS points here, run: certbot --nginx -d reviewhub.technobuzzsystems.com

server {
    listen 80;
    listen [::]:80;
    server_name reviewhub.technobuzzsystems.com;

    client_max_body_size 12M;

    location /static/ {
        alias /var/www/reviewhub/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
